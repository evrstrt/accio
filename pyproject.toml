[project]
name = "accio"
version = "0.1.0"
description = "Frame preparation for 360 site walks: ingest, review, tracked export"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.2",
    "timm>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accio"]
