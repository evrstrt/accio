[project]
name = "accio"
version = "0.1.0"
description = "Frame preparation for 360 site walks: ingest, review, tracked export"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.2",
    "timm>=1.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "piexif>=1.1.3",
    "transformers>=4.44",
    "scipy>=1.11",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accio"]
