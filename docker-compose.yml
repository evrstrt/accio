# ACCIO_DATA_DIR is read from the shell or .env at compose time.

services:
  accio:
    build: .
    restart: unless-stopped
    ports:
      # loopback only: no auth, and the container holds the Docker socket
      - "127.0.0.1:8000:8000"
    environment:
      ACCIO_DATA: ${ACCIO_DATA_DIR:-/srv/accio/data}
    volumes:
      # same path inside and out, so the sibling stitcher container's bind
      # mounts (resolved by the host) point at the same files
      - ${ACCIO_DATA_DIR:-/srv/accio/data}:${ACCIO_DATA_DIR:-/srv/accio/data}
      - /var/run/docker.sock:/var/run/docker.sock
      - models:/models
    # Docker does not restart on unhealthy; whatever monitors this must
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # DINOv3 plus Grounding DINO + SAM peak around 6 GB on CPU
    mem_limit: 12g

volumes:
  models:
